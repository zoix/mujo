# tmux in the karma desktop. Colours come from karma-theme.conf, which
# `karma theme build` generates from design/tokens.json. Do not put colours
# here. Your own settings go in ~/.config/tmux/local.conf (optional).

# Prefix: Ctrl+A.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Windows and panes count from 1, like the keys.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal: true colour, focus events, and modified keys such as Ctrl+Enter
# passed on to the program inside (Claude Code and Neovim use them).
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',xterm*:extkeys'
set -s extended-keys on
set -g focus-events on
set -s escape-time 10
set -s set-clipboard on
set -g mouse on
set -g history-limit 50000

# Status line at the bottom.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 50

# Prefix r: load this file again.
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf loaded again'

# Prefix t: show or hide the status line.
bind t set -g status

# New windows and splits start in the directory of the current pane.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# lazygit: prefix g in a new window, prefix G as a pop-up.
bind g new-window -n lazygit -c '#{pane_current_path}' lazygit
bind G display-popup -E -w 95% -h 95% -d '#{pane_current_path}' lazygit

# Prefix Ctrl+E: jump to another session. Prefix Ctrl+F: jump to a window.
bind C-e display-popup -E "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' | \
  sed '/^$/d' | \
  fzf --reverse --header jump-to-session | \
  xargs -r tmux switch-client -t"
bind C-f display-popup -E "\
  tmux list-windows -F '#{window_index} #{window_name}' | \
  sed '/^$/d' | \
  fzf --reverse --header jump-to-window | \
  cut -d ' ' -f 1 | \
  xargs -r tmux select-window -t"

# Ctrl+H/J/K/L move between panes. When the pane runs Neovim or Vim the key
# goes to the editor instead, so the same keys can move between its splits.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Prefix Ctrl+L clears the screen, since plain Ctrl+L now moves.
bind C-l send-keys C-l

# Colours, then your own settings.
source-file -q ~/.config/tmux/karma-theme.conf
source-file -q ~/.config/tmux/local.conf
