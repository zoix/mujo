# kitty: karma's terminal. Colours, font and padding come from
# karma-theme.conf, which `karma theme build` generates from design/tokens.json.
# Put personal overrides in local.conf next to this file (not managed by karma).

include karma-theme.conf

# Behaviour
enable_audio_bell      no
confirm_os_window_close 0
copy_on_select         clipboard
strip_trailing_spaces  smart
scrollback_lines       10000
update_check_interval  0

# Look (sizes and colours are in karma-theme.conf)
hide_window_decorations yes
# The compositor decides window sizes. Without this kitty reopens maximized
# whenever its last window was closed in that state.
remember_window_size    no
cursor_shape            beam
cursor_blink_interval   0
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted

# `karma theme build` sends SIGUSR1 to kitty, which reloads this file in
# every open window. That needs no remote control, so it stays off.
allow_remote_control no

# Paste with Ctrl+V as in other apps, and with the usual Ctrl+Shift+V.
# (Ctrl+V no longer reaches programs in the terminal: in vim use Ctrl+Q for
# block selection.)
map ctrl+v       paste_from_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# A glob that matches nothing is silently skipped, so local.conf is optional.
globinclude local.conf
