# Idle handling for the karma session (hypridle).
# Locking goes through karma, which asks the Quickshell lock screen.

general {
    lock_cmd = $HOME/.local/bin/karma power lock
    before_sleep_cmd = $HOME/.local/bin/karma power lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Lock after 10 minutes without input.
listener {
    timeout = 600
    on-timeout = $HOME/.local/bin/karma power lock
}

# Screens off a minute later; any input turns them back on.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
